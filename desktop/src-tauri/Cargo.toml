[package]
name = "voltra-controller"
version = "0.1.0"
description = "Voltra desktop controller — manages the Docker trading stack"
authors = ["Voltra"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
# OS-native secret storage (Windows Credential Manager on Windows) for the
# user's Kraken API key/secret — never written to disk in plaintext.
keyring = "2"

[features]
# by default Tauri runs in production mode, unless `tauri dev` is used.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
