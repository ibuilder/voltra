<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltra — Cockpit</title>
<link rel="icon" href="favicon.ico" sizes="any">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  body { background: #0b1220; }
  .card { background: #111a2e; border: 1px solid #1e2a44; }
  .btn { transition: filter .15s; }
  .btn:hover { filter: brightness(1.12); }
</style>
</head>
<body class="min-h-screen text-slate-200 font-sans">

<!-- Login -->
<div id="login-view" class="flex min-h-screen items-center justify-center p-4">
  <form id="login-form" class="card w-full max-w-sm rounded-2xl p-8 shadow-xl">
    <img src="voltra-logo.png" alt="Voltra" style="height:30px">
    <p class="mt-2 text-sm text-slate-400">Connect to your bot</p>
    <label class="mt-6 block text-xs uppercase tracking-wide text-slate-400">Mode / bot</label>
    <select id="in-api" class="mt-1 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm focus:border-amber-400 focus:outline-none">
      <option value="http://127.0.0.1:8080">Aggressive — TrendBreak (BTC/ETH/SOL/XRP)</option>
      <option value="http://127.0.0.1:8081">Lead-lag — SolCross (BTC/ETH → SOL)</option>
      <option value="http://127.0.0.1:8082">Experimental — TradingView webhook</option>
    </select>
    <label class="mt-4 block text-xs uppercase tracking-wide text-slate-400">Username</label>
    <input id="in-user" value="voltra" autocomplete="username" class="mt-1 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm focus:border-amber-400 focus:outline-none">
    <label class="mt-4 block text-xs uppercase tracking-wide text-slate-400">Password</label>
    <input id="in-pass" type="password" autocomplete="current-password" class="mt-1 w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm focus:border-amber-400 focus:outline-none">
    <button class="btn mt-6 w-full rounded-lg bg-amber-400 py-2 font-semibold text-slate-900">Connect</button>
    <p id="login-error" class="mt-3 hidden text-sm text-rose-400"></p>
  </form>
</div>

<!-- Cockpit -->
<div id="dash-view" class="hidden mx-auto max-w-5xl p-4 sm:p-6">
  <header class="flex flex-wrap items-center gap-3">
    <img src="voltra-logo.png" alt="Voltra" style="height:26px">
    <select id="mode-switch" onchange="switchBot(this.value)" class="rounded-lg bg-slate-900 border border-slate-700 px-2 py-1 text-sm focus:border-amber-400 focus:outline-none">
      <option value="http://127.0.0.1:8080">Aggressive — TrendBreak</option>
      <option value="http://127.0.0.1:8081">Lead-lag — SolCross</option>
      <option value="http://127.0.0.1:8082">Experimental — webhook</option>
    </select>
    <span id="badge-mode" class="rounded-full px-3 py-1 text-xs font-bold"></span>
    <div class="ml-auto flex items-center gap-3">
      <span id="last-update" class="text-xs text-slate-500"></span>
      <a id="frequi-link" target="_blank" class="text-xs text-slate-500 underline hover:text-amber-400">advanced view ↗</a>
    </div>
  </header>

  <p id="dash-error" class="mt-4 hidden rounded-lg border border-rose-800 bg-rose-950/60 p-3 text-sm text-rose-300"></p>

  <!-- The one thing you look at: plain-English status + controls -->
  <section class="card mt-5 rounded-2xl p-6">
    <p id="status-line" class="text-lg font-semibold text-white">—</p>
    <p id="money-line" class="mt-1 text-sm text-slate-300">—</p>
    <p id="bench-line" class="mt-3 rounded-lg bg-slate-900/60 px-3 py-2 text-sm">—</p>
    <div class="mt-5 flex flex-wrap gap-3">
      <button onclick="command('start')" class="btn rounded-lg bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-900">▶ Start</button>
      <button onclick="command('stop')" class="btn rounded-lg bg-rose-500 px-4 py-2 text-sm font-semibold text-slate-900">■ Stop</button>
      <button onclick="command('reload_config')" class="btn rounded-lg border border-slate-600 px-4 py-2 text-sm font-semibold">↻ Reload</button>
      <button onclick="refresh()" class="btn ml-auto rounded-lg border border-slate-700 px-4 py-2 text-sm">Refresh now</button>
    </div>
  </section>

  <!-- Details (kept small, below the fold) -->
  <section class="mt-5 grid grid-cols-2 gap-3 md:grid-cols-4">
    <div class="card rounded-xl p-4"><p class="text-xs text-slate-400">Balance</p><p id="kpi-balance" class="mt-1 text-lg font-bold text-white">—</p></div>
    <div class="card rounded-xl p-4"><p class="text-xs text-slate-400">Closed P/L</p><p id="kpi-pnl" class="mt-1 text-lg font-bold">—</p></div>
    <div class="card rounded-xl p-4"><p class="text-xs text-slate-400">Trades (W/L)</p><p id="kpi-trades" class="mt-1 text-lg font-bold text-white">—</p></div>
    <div class="card rounded-xl p-4"><p class="text-xs text-slate-400">Max drawdown</p><p id="kpi-dd" class="mt-1 text-lg font-bold text-white">—</p></div>
  </section>

  <div class="mt-5 grid gap-5 lg:grid-cols-3">
    <section class="card rounded-xl p-4 lg:col-span-2">
      <h2 class="text-sm font-semibold text-slate-300">Daily P/L (last 14 days)</h2>
      <div class="mt-3 h-56"><canvas id="chart-daily"></canvas></div>
    </section>
    <section class="card rounded-xl p-4">
      <h2 class="text-sm font-semibold text-slate-300">Trading these coins</h2>
      <div id="whitelist" class="mt-3 flex flex-wrap gap-2"></div>
      <h2 class="mt-4 text-sm font-semibold text-slate-300">Open trades</h2>
      <div id="open-wrap" class="mt-2 text-sm"></div>
    </section>
  </div>

  <footer class="mt-6 text-center text-xs text-slate-600">
    Voltra · your bot's report card · not financial advice
  </footer>
</div>

<div id="toast" class="fixed bottom-5 left-1/2 hidden -translate-x-1/2 rounded-lg px-4 py-2 text-sm shadow-lg"></div>

<script>
const $ = (id) => document.getElementById(id);
let API = "", TOKEN = "", USER = "", PASS = "", chart = null, timer = null;

const fmtUsd = (v) => (v == null ? "—" : v.toLocaleString("en-US", { style: "currency", currency: "USD" }));
const fmtPct = (v) => (v == null ? "—" : `${(v * 100).toFixed(2)}%`);
const fmtSignedPct = (v) => (v == null ? "—" : `${v >= 0 ? "+" : ""}${(v * 100).toFixed(1)}%`);

function toast(msg, bad) {
  const el = $("toast");
  el.textContent = msg;
  el.className = `fixed bottom-5 left-1/2 -translate-x-1/2 rounded-lg px-4 py-2 text-sm shadow-lg ${bad ? "bg-rose-600 text-white" : "bg-emerald-500 text-slate-900"}`;
  setTimeout(() => el.classList.add("hidden"), 3000);
}

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  USER = $("in-user").value; PASS = $("in-pass").value;
  const ok = await connect($("in-api").value);
  if (!ok) return;
  $("mode-switch").value = API;
  $("login-view").classList.add("hidden");
  $("dash-view").classList.remove("hidden");
  await refresh();
  timer = setInterval(refresh, 15000);
});

async function connect(url) {
  API = url.replace(/\/+$/, "");
  const basic = btoa(`${USER}:${PASS}`);
  try {
    const r = await fetch(`${API}/api/v1/token/login`, { method: "POST", headers: { Authorization: `Basic ${basic}` } });
    if (!r.ok) throw new Error(`login failed (HTTP ${r.status})`);
    TOKEN = (await r.json()).access_token;
    $("frequi-link").href = API;
    return true;
  } catch (err) {
    const el = $("login-error");
    el.textContent = `${err.message} — is that bot running?`;
    el.classList.remove("hidden");
    return false;
  }
}

async function switchBot(url) {
  if (await connect(url)) { toast("switched"); refresh(); }
}

async function api(path) {
  const r = await fetch(`${API}/api/v1${path}`, { headers: { Authorization: `Bearer ${TOKEN}` } });
  if (!r.ok) throw new Error(`${path} → HTTP ${r.status}`);
  return r.json();
}

// Bot commands. start/stop/reload only — this never touches dry_run (live is a
// human-only config change the bot API can't make from here).
async function command(action) {
  const label = { start: "Start", stop: "Stop", reload_config: "Reload" }[action];
  if (action === "stop" && !confirm("Stop the bot? It won't open new trades until you Start it again.")) return;
  try {
    const r = await fetch(`${API}/api/v1/${action}`, {
      method: "POST",
      headers: { Authorization: `Bearer ${TOKEN}`, "Content-Type": "application/json" },
    });
    const j = await r.json().catch(() => ({}));
    toast(j.status || `${label} sent`);
    setTimeout(refresh, 900);
  } catch (err) {
    toast(`${label} failed: ${err.message}`, true);
  }
}

// Honest benchmark: how the bot has done since it started vs. simply holding BTC
// over the same window. Returns {ret, days} or null if it can't be computed.
async function buyHoldReturn(profit) {
  try {
    const start = profit.bot_start_timestamp;
    if (!start) return null;
    const c = await api("/pair_candles?pair=BTC/USD&timeframe=1h&limit=800");
    const ci = c.columns.indexOf("close");
    const di = c.columns.indexOf("date");
    if (ci < 0 || di < 0 || !c.data.length) return null;
    const first = c.data.find((row) => new Date(row[di]).getTime() >= start);
    const startClose = first ? first[ci] : c.data[0][ci];
    const endClose = c.data[c.data.length - 1][ci];
    if (!startClose) return null;
    return { ret: endClose / startClose - 1, days: Math.max(1, Math.round((Date.now() - start) / 86400000)) };
  } catch {
    return null;
  }
}

async function refresh() {
  try {
    const [cfg, profit, balance, status, daily, whitelist] = await Promise.all([
      api("/show_config"), api("/profit"), api("/balance"),
      api("/status"), api("/daily?timescale=14"), api("/whitelist"),
    ]);
    $("dash-error").classList.add("hidden");
    const bh = await buyHoldReturn(profit);
    renderCockpit(cfg, profit, balance, bh);
    renderKpis(profit, balance);
    renderDaily(daily);
    renderWhitelist(whitelist);
    renderTrades(status);
    $("last-update").textContent = `updated ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    const el = $("dash-error");
    el.textContent = `Refresh failed: ${err.message}`;
    el.classList.remove("hidden");
  }
}

function renderCockpit(cfg, profit, balance, bh) {
  const dry = cfg.dry_run, running = cfg.state === "running";
  const badge = $("badge-mode");
  badge.textContent = dry ? "PRACTICE" : "LIVE";
  badge.className = `rounded-full px-3 py-1 text-xs font-bold ${dry ? "bg-sky-900 text-sky-300" : "bg-rose-900 text-rose-300"}`;

  $("status-line").textContent = dry
    ? (running ? "🧪 Practicing with pretend money — the bot is running and watching the market." : "🧪 Practicing — the bot is stopped.")
    : (running ? "🔴 LIVE with real money — the bot is running." : "🔴 LIVE — the bot is stopped.");

  const startBal = balance.starting_capital ?? null;
  const ret = balance.starting_capital_ratio ?? (startBal ? (balance.total - startBal) / startBal : null);
  const now = (startBal != null && ret != null) ? startBal * (1 + ret) : (balance.total ?? null);
  $("money-line").textContent = startBal != null
    ? `Started ${fmtUsd(startBal)} · now ${fmtUsd(now)} · ${ret >= 0 ? "up" : "down"} ${fmtUsd(Math.abs(now - startBal))} (${fmtSignedPct(ret)}).`
    : `Balance ${fmtUsd(now)}.`;

  const bl = $("bench-line");
  if (bh && ret != null) {
    const winning = ret >= bh.ret;
    bl.innerHTML = `Since the bot started (${bh.days} day${bh.days === 1 ? "" : "s"}): ` +
      `<b>Voltra ${fmtSignedPct(ret)}</b> vs. just holding BTC <b>${fmtSignedPct(bh.ret)}</b> — ` +
      (winning ? `<span class="text-emerald-400">✅ beating buy-and-hold</span>` : `<span class="text-amber-400">⚠️ trailing buy-and-hold</span>`);
    bl.classList.remove("hidden");
  } else {
    bl.textContent = "Buy-and-hold comparison will appear once there's price history to compare.";
  }
}

function renderKpis(profit, balance) {
  $("kpi-balance").textContent = fmtUsd(balance.total_bot ?? balance.total);
  const pnl = profit.profit_closed_coin ?? 0;
  const pnlEl = $("kpi-pnl");
  pnlEl.textContent = fmtUsd(pnl);
  pnlEl.className = `mt-1 text-lg font-bold ${pnl >= 0 ? "text-emerald-400" : "text-rose-400"}`;
  const w = profit.winning_trades ?? 0, l = profit.losing_trades ?? 0;
  $("kpi-trades").textContent = `${profit.closed_trade_count ?? 0} (${w}W/${l}L)`;
  $("kpi-dd").textContent = profit.max_drawdown != null ? fmtPct(profit.max_drawdown) : "—";
}

function renderDaily(daily) {
  const rows = (daily.data || []).slice().reverse();
  const labels = rows.map((d) => d.date.slice(5));
  const values = rows.map((d) => d.abs_profit);
  if (chart) chart.destroy();
  chart = new Chart($("chart-daily"), {
    type: "bar",
    data: { labels, datasets: [{ data: values, backgroundColor: values.map((v) => (v >= 0 ? "#34d399" : "#fb7185")) }] },
    options: {
      animation: false, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: "#64748b" }, grid: { display: false } }, y: { ticks: { color: "#64748b" }, grid: { color: "#1e2a44" } } },
    },
  });
}

function renderWhitelist(wl) {
  $("whitelist").innerHTML = (wl.whitelist || [])
    .map((p) => `<span class="rounded-full bg-slate-800 px-3 py-1 text-xs text-slate-300">${p}</span>`)
    .join("");
}

function renderTrades(status) {
  const wrap = $("open-wrap");
  if (!status.length) {
    wrap.innerHTML = `<p class="text-slate-500">None — the bot is waiting for a good setup.</p>`;
    return;
  }
  wrap.innerHTML = status.map((t) => {
    const ratio = t.profit_ratio ?? 0;
    const cls = ratio >= 0 ? "text-emerald-400" : "text-rose-400";
    return `<div class="flex justify-between border-t border-slate-800 py-1.5">
      <span class="font-semibold text-white">${t.pair}</span>
      <span class="${cls}">${fmtSignedPct(ratio)}</span></div>`;
  }).join("");
}
</script>
</body>
</html>
