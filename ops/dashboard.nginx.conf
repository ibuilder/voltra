server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never let browsers cache the dashboard — always serve the latest build so
    # edits show up on a normal reload (no more stuck-on-stale-page / hard-refresh).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
