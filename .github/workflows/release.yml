name: Release desktop controller

# Build the Voltra Controller .exe/.msi and publish a GitHub Release with a
# signed updater manifest (latest.json). Trigger by pushing a version tag:
#   git tag app-v0.1.0 && git push origin app-v0.1.0
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           (from: npx @tauri-apps/cli signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# GITHUB_TOKEN is provided automatically.
#
# OPTIONAL — Authenticode code signing (removes AV false positives + SmartScreen
# warnings for end users). Set these up per docs/code-signing.md; until then the
# build is unsigned but fully functional. Uses Azure Trusted Signing:
#   Secrets:   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   Variables: AZURE_TS_ENDPOINT, AZURE_TS_ACCOUNT, AZURE_TS_PROFILE
# Signing activates automatically once AZURE_CLIENT_ID exists.

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # True only when Azure Trusted Signing is configured. Gates the signing
      # step so unsigned builds keep working until you enroll.
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        working-directory: desktop
        run: npm install

      # Authenticode signing (optional). Injects a Tauri `signCommand` so each
      # bundle is Authenticode-signed DURING the build — before the updater
      # signature is computed, so latest.json stays valid. Skipped entirely when
      # Azure Trusted Signing isn't configured. See docs/code-signing.md.
      - name: Configure Authenticode signing
        if: env.HAS_SIGNING == 'true'
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          cargo install trusted-signing-cli --locked
          SIGN_CMD="trusted-signing-cli -e ${{ vars.AZURE_TS_ENDPOINT }} -a ${{ vars.AZURE_TS_ACCOUNT }} -c ${{ vars.AZURE_TS_PROFILE }} %1"
          jq --arg c "$SIGN_CMD" '.bundle.windows = ((.bundle.windows // {}) + {signCommand:$c})' tauri.conf.json > conf.tmp && mv conf.tmp tauri.conf.json
          echo "Authenticode signing enabled via Azure Trusted Signing."

      - name: Build, sign, and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Azure Trusted Signing credentials (empty/harmless when not configured).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Voltra Controller ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. Signed auto-update artifacts attached."
          releaseDraft: true
          prerelease: false
          # The app is distributed as the NSIS -setup.exe (currentUser, no admin),
          # so make the updater's primary windows-x86_64 entry point at NSIS too —
          # otherwise auto-update pulls the per-machine MSI and can trigger UAC.
          updaterJsonPreferNsis: true
          # tauri-action emits latest.json (the updater manifest) automatically
          # when the updater plugin is active and a signing key is present.
          includeUpdaterJson: true
