name: Release desktop controller

# Build Voltra Controller for Windows, macOS, and Linux and publish a draft
# GitHub Release with a signed updater manifest (latest.json).
#   git tag app-v0.1.1 && git push origin app-v0.1.1
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# OPTIONAL Windows Authenticode (docs/code-signing.md):
#   Secrets:   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   Variables: AZURE_TS_ENDPOINT, AZURE_TS_ACCOUNT, AZURE_TS_PROFILE

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    env:
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        working-directory: desktop
        run: npm install

      - name: Configure Authenticode signing
        if: runner.os == 'Windows' && env.HAS_SIGNING == 'true'
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          cargo install trusted-signing-cli --locked
          SIGN_CMD="trusted-signing-cli -e ${{ vars.AZURE_TS_ENDPOINT }} -a ${{ vars.AZURE_TS_ACCOUNT }} -c ${{ vars.AZURE_TS_PROFILE }} %1"
          jq --arg c "$SIGN_CMD" '.bundle.windows = ((.bundle.windows // {}) + {signCommand:$c})' tauri.conf.json > conf.tmp && mv conf.tmp tauri.conf.json
          echo "Authenticode signing enabled via Azure Trusted Signing."

      - name: Build, sign, and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Voltra Controller ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. Windows / macOS / Linux installers. Signed auto-update artifacts attached."
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: true
